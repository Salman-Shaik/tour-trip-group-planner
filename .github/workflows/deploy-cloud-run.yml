name: Deploy Cloud Run
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  id-token: write
env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')) &&
      vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: cloud-run-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy
        run: >-
          gcloud run deploy "$SERVICE"
          --project "$PROJECT_ID"
          --region "$REGION"
          --image "$IMAGE"
          --platform managed
          --allow-unauthenticated
          --max-instances 2
          --set-env-vars "ROAMLY_DB_BACKEND=firestore,GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"
