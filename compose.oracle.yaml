name: roamly
services:
  roamly:
    image: ${ROAMLY_IMAGE:?ROAMLY_IMAGE is required}
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    volumes:
      - roamly-data:/app/data
      - ./bootstrap:/bootstrap:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      roamly:
        condition: service_healthy
    environment:
      ROAMLY_DOMAIN: ${ROAMLY_DOMAIN:?ROAMLY_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  roamly-data:
    name: roamly-data
  caddy-data:
    name: roamly-caddy-data
  caddy-config:
    name: roamly-caddy-config
